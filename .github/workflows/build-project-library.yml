
name: Build B.NOVA project library
on:
  push:
    branches: [main, master]
    paths:
      - 'projects/**'
      - 'scripts/build_projects.py'
      - '.github/workflows/build-project-library.yml'
permissions:
  contents: write
jobs:
  build-project-library:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build project listing
        run: python3 scripts/build_projects.py
      - name: Commit updated project list
        run: |
          if git diff --quiet -- projects.json; then
            echo "Project library is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add projects.json
            git commit -m "Update B.NOVA project library automatically"
            git push
          fi
